<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cardbox</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="landing">
    <h1>🃏 Cardbox</h1>
    <p class="tagline">
      A Cards-Against-Humanity-style party game. Open a Board on a laptop and

    </p>
    <div class="actions">
      <a href="/board/new"><button class="big">Open a Board</button></a>
      <a href="/play"><button class="big secondary">Join a game</button></a>
      <a href="/cards"><button class="big secondary">Add cards</button></a>
    </div>
  </div>
</body>
</html>
