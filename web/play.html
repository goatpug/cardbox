<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cardbox — Play</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="toast-host"></div>
  <div id="board-disconnected" class="badge hidden" style="position:fixed;top:0.6em;left:50%;transform:translateX(-50%);z-index:150;background:var(--danger);color:white;">
    Board disconnected
  </div>

  <!-- JOIN -->
  <div id="screen-join" class="join-screen">
    <h1>🃏 Cardbox</h1>
    <div class="col">
      <label class="muted">Room code
        <input id="join-code" type="text" maxlength="4" placeholder="ABCD" autocapitalize="characters" />
      </label>
      <label class="muted">Your name
        <input id="join-name" type="text" maxlength="20" placeholder="Your name" />
      </label>
      <div id="join-error" class="muted hidden" style="color:var(--danger)"></div>
      <button id="btn-join" class="big">Join game</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="screen-app" class="player-app hidden">
    <header class="player-header">
      <div class="meta">
        <span id="phase-status">-</span>
        <span id="timer-pill" class="timer-pill hidden"></span>
      </div>
      <div class="card black">
        <div class="card-text" id="header-black-text"></div>
      </div>
    </header>

    <main class="hand-area" id="hand-area"></main>

    <div id="confirm-bar" class="confirm-bar hidden">
      <span class="muted grow" id="confirm-hint"></span>
      <button id="btn-confirm" disabled>Confirm</button>
    </div>

    <button id="btn-open-editor" class="fab secondary">＋ Cards</button>
  </div>

  <!-- KICKED -->
  <div id="screen-kicked" class="full-screen-msg hidden">
    <h1>You've been removed</h1>
    <p class="muted">The host removed you from this game.</p>
  </div>

  <!-- CARD EDITOR -->
  <div id="editor-sheet" class="editor-sheet hidden">
    <div class="sheet-body">
      <div class="row" style="justify-content:space-between">
        <h2>Add a custom card</h2>
        <button class="ghost icon" id="editor-close">✕</button>
      </div>
      <div id="editor-root"></div>
    </div>
  </div>

  <script type="module" src="/static/play.js"></script>
</body>
</html>
